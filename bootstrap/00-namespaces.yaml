# Platform namespaces + tenant (business) namespaces.
#
# Adding a new business = append a namespace block with these two labels:
#   equity.io/tenant: <slug>          # kebab-case, used in console URLs
#   equity.io/tenant-name: <display>  # human name shown in the console sidebar
# Then re-apply (kubectl apply -f bootstrap/00-namespaces.yaml) OR re-run
# ./local/up.sh (idempotent). Console auto-discovers on next request.

# ─── Platform (shared across all businesses) ──────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: nats
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

# ─── Businesses (tenants) ─────────────────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: pypes-prod
  labels:
    equity.io/tenant: pypes
    equity.io/tenant-name: Pypes
---
apiVersion: v1
kind: Namespace
metadata:
  name: hiringfunnel-prod
  labels:
    equity.io/tenant: hiringfunnel
    equity.io/tenant-name: HiringFunnel
---
apiVersion: v1
kind: Namespace
metadata:
  name: cjs-prod
  labels:
    equity.io/tenant: cjs
    equity.io/tenant-name: CareerJumpship

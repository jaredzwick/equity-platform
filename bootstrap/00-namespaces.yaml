# Platform namespaces. Fresh init ships with ZERO tenants — create them
# via the console (Master → + New Business) or by appending a namespace
# block here with the two required labels:
#
#   equity.io/tenant: <slug>          # kebab-case, used in console URLs
#   equity.io/tenant-name: <display>  # human name shown in the sidebar
#
# Then re-apply (kubectl apply -f bootstrap/00-namespaces.yaml) or re-run
# ./local/up.sh (idempotent). The console auto-discovers on next request.

# ─── Platform (shared) ────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: nats
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

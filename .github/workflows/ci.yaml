name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        run: |
          pip install --quiet yamllint
          # Config in ./.yamllint (extends relaxed; ignores node_modules/.next).
          # No --strict: warnings do not fail the build; errors do.
          yamllint .

  console-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  landing-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      # Build-time placeholders — required env vars throw at build if unset.
      # These are non-secret dummies just to let `next build` complete.
      GITHUB_APP_CLIENT_ID: ci-placeholder
      GITHUB_APP_CLIENT_SECRET: ci-placeholder
      SESSION_PASSWORD: ci-placeholder-session-password-32-chars
      UPSTREAM_REPO: jaredzwick/equity-platform
      NEXT_PUBLIC_SITE_URL: http://localhost:3040
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  kubeval-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xzC /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Validate bootstrap manifests
        run: kubeconform -strict -ignore-missing-schemas -summary bootstrap/
      - name: Validate app manifests
        run: kubeconform -strict -ignore-missing-schemas -summary apps/

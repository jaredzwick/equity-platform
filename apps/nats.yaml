apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: chart from Helm repo + values from THIS git repo.
  # Both entries must live under `sources[]` — if you also set `spec.source`,
  # ArgoCD ignores it entirely when `sources[]` is present.
  sources:
    - repoURL: https://nats-io.github.io/k8s/helm/charts
      chart: nats
      targetRevision: 1.2.11
      helm:
        valueFiles:
          - $values/charts/nats/values.yaml
    - repoURL: https://github.com/jaredzwick/equity-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The NATS Helm chart renders full PVC objects (apiVersion, kind,
  # creationTimestamp: null, empty status) inside the StatefulSet's
  # volumeClaimTemplates. The Kube API server strips apiVersion/kind
  # and normalizes null/empty fields on write, so without these ignore
  # rules the app is perma-OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp
        - .spec.volumeClaimTemplates[]?.status

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nats
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multi-source: chart from Helm repo + values from THIS git repo.
  # Both entries must live under `sources[]` — if you also set `spec.source`,
  # ArgoCD ignores it entirely when `sources[]` is present.
  sources:
    - repoURL: https://nats-io.github.io/k8s/helm/charts
      chart: nats
      targetRevision: 1.2.11
      helm:
        valueFiles:
          - $values/charts/nats/values.yaml
    - repoURL: https://github.com/jaredzwick/equity-platform.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nats
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The NATS Helm chart renders `creationTimestamp: null` inside the
  # StatefulSet's volumeClaimTemplates[].metadata. The Kube API strips
  # nulls on write, so without this ignore rule the app is perma-OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.metadata.creationTimestamp

apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-pypes-dev-seo-audit
  namespace: pypes-prod
  labels:
    equity.io/tenant: pypes
    equity.io/managed-by: console
    equity.io/runner: claude
spec:
  schedule: "3 4 * * 2"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: worker
              image: equity/claude-runner:latest
              imagePullPolicy: IfNotPresent
              command: ["/entrypoint.sh"]
              env:
                - name: PROMPT
                  value: |-
                    You are an SEO analyst for pypes.dev. Today is a weekly review. Do the following:

                    1. SITE STRUCTURE — Fetch https://pypes.dev and crawl its key pages
                       (homepage, /join, any linked nav pages). Map the page hierarchy,
                       heading structure (H1–H3), internal link graph, and meta tags.

                    2. PERFORMANCE SIGNALS — Use web search to find any public data on
                       pypes.dev: DA/PA estimates, backlink counts, indexed pages,
                       Core Web Vitals if available, PageSpeed scores.

                    3. GSC IMPRESSION PROXY — Search for pypes.dev on Google and note
                       which queries/pages appear, estimated SERP positions, and any
                       featured snippets. (Real GSC data requires API auth not yet
                       wired; flag if you need it.)

                    4. KEYWORD ANALYSIS — Identify the top 10–15 keywords the site
                       appears to target vs. what it actually ranks for. Note gaps,
                       cannibalization, and missed long-tail opportunities.

                    5. RECOMMENDATIONS — Produce a prioritized list (High/Med/Low) of
                       concrete improvements: copy changes, new pages to create, schema
                       markup to add, backlink targets, technical fixes.

                    Output a clean markdown report with sections matching the five
                    tasks above. Be specific — name exact pages, exact keywords,
                    exact fixes. No filler.
                - name: TENANT
                  value: pypes
                - name: CRON_NAME
                  value: weekly-pypes-dev-seo-audit
                - name: NATS_URL
                  value: nats://nats.nats.svc.cluster.local:4222
                - name: CLAUDE_CODE_OAUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: claude-runner-auth
                      key: oauth-token

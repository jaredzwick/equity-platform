# ingress-nginx chart values.
# Chart version pinned in apps/ingress-nginx.yaml.
controller:
  # Kind-friendly defaults: hostPort 80/443 mapped to the control-plane node
  # via the kind cluster extraPortMappings in local/kind-cluster.yaml.
  service:
    type: NodePort
  hostPort:
    enabled: true
  # nodeSelector ties the controller to the ingress-ready node label set in
  # kind-cluster.yaml. Prod deploys can drop this and use a normal LoadBalancer.
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Equal
      effect: NoSchedule
  admissionWebhooks:
    enabled: false
